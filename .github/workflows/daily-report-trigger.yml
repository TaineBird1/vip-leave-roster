# Wakes the app and asks it to check whether the daily VIP report is due.
# The app decides when to send (time is set in Admin → Settings) and never sends a date twice,
# so running this often is safe. Needs two repository secrets:
#   HUB_URL      e.g. https://vip-leave-roster.onrender.com
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Render
name: Daily report trigger
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the Hub to check the report
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$HUB_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Set the HUB_URL and CRON_SECRET repository secrets."; exit 1; fi
          curl --fail-with-body --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$HUB_URL/api/cron/daily-report"
